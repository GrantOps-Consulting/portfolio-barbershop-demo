<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <title>Lost a Step — Trongate Barber Co.</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://grantopsconsulting.com/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,400..900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0A0E0B;
      color: #E9DEC6;
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 32px;
      text-align: center;
    }
    .glyph {
      font-family: 'Bodoni Moda', serif;
      font-style: italic;
      font-weight: 500;
      font-size: clamp(140px, 30vw, 380px);
      line-height: 0.86;
      color: #C4A077;
      letter-spacing: -0.04em;
    }
    h1 {
      font-family: 'Bodoni Moda', serif;
      font-style: italic;
      font-weight: 500;
      font-size: clamp(28px, 4vw, 48px);
      letter-spacing: -0.01em;
      margin: 28px 0 12px;
      color: #E9DEC6;
    }
    p {
      max-width: 48ch;
      color: #B5A88B;
      line-height: 1.6;
      margin-bottom: 28px;
      font-size: 13px;
      letter-spacing: 0.06em;
    }
    a {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #C4A077;
      border: 1px solid #C4A077;
      padding: 14px 22px;
      text-decoration: none;
      transition: background 0.3s, color 0.3s;
    }
    a:hover { background: #C4A077; color: #0A0E0B; }
  </style>
</head>
<body>
  <div class="glyph">404</div>
  <h1>Lost a step.</h1>
  <p>This page isn't on the floor. Head back to the chair and we'll start over.</p>
  <a href="/">← Back to Trongate</a>
</body>
</html>
